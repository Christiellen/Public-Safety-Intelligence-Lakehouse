# Databricks Asset Bundle: the pipeline as code.
#   databricks bundle validate          # check the configuration
#   databricks bundle deploy            # deploy to the dev target (default)
#   databricks bundle run psi_pipeline  # run the job now
#   databricks bundle deploy -t prod    # deploy the scheduled production job
bundle:
  name: public-safety-intelligence-lakehouse

include:
  - resources/*.yml

sync:
  exclude:
    - tests/**
    - docs/**

targets:
  dev:
    # Development mode: resources are prefixed with "[dev <user>]" and schedules are paused,
    # so a deploy from a laptop never competes with the production job.
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
