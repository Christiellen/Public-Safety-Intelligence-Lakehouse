name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check --output-format=github .

  test:
    name: Tests (pytest + local Spark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:                              # loader and BI views of the Superset stack
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: psi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d psi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PSI_TEST_POSTGRES_DSN: postgresql://postgres:ci-only-password@localhost:5432/psi_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5          # Spark runs on the JVM
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"             # same as Databricks serverless
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --junitxml=reports/junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-report
          path: reports/junit.xml

  bundle:
    name: Databricks bundle (validate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs only when the repository has the secrets DATABRICKS_HOST and DATABRICKS_TOKEN;
    # otherwise the step is skipped (forks and pull requests from outside have no secrets).
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
        if: env.DATABRICKS_HOST != ''
      - name: Validate bundle
        if: env.DATABRICKS_HOST != ''
        # the summary (user e-mail, workspace paths) is not printed in the public log; errors still are
        run: databricks bundle validate --output json > /dev/null
      - name: Skip notice
        if: env.DATABRICKS_HOST == ''
        run: echo "DATABRICKS_HOST/DATABRICKS_TOKEN secrets not set; bundle validation skipped."

